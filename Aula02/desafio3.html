<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://i.pinimg.com/736x/d4/e0/bd/d4e0bde674fbb4d88ae339a2febe724b.jpg" type="image/x-icon">
    <title>DESAFIO 03 - JAVASCRIPT</title>

</head>
<body>
    <h1><mark>MANIPULANDO IMAGENS</mark> DO HTML ATRAVÉS DO JS</h1>
    <hr>
    <div>
        <img width="100%" src="img/corinthas.jpg" alt="yiru" title="sccp">
        <button onclick="trocar_imagem()">TROCAR IMAGEM</button>
    </div>
 
    <script>
              
        const tag_body = document.getElementsByTagName('body')[0];
        tag_body.style.backgroundColor="grey";
        console.log(tag_body);
        
        const tag_div = document.getElementsByTagName('div')[0];
        console.log(tag_div);
        tag_div.style.backgroundColor = "antiquewhite"
        tag_div.style.border = "1px";
        tag_div.style.borderStyle="solid";
        tag_div.style.borderColor="red";

        function trocar_imagem(){
            const tag_img = document.getElementsByTagName('img')[0];
            tag_img.src="img/corinthas.jpg";
            tag_img.title="corinthans"
        }
        

    </script>

    
</body>
<html>
